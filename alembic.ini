[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# Timestamp-prefixed revision files keep history readable in directory listings.
file_template = %%(rev)s_%%(slug)s
version_path_separator = os
# The URL is resolved in migrations/env.py from ARAD_DATABASE_URL so that the
# migration runner always talks to the same database as the application.
sqlalchemy.url =

# Formatting of generated revisions is done by ``make format`` / ruff in CI
# rather than through an alembic post-write hook, so migration generation does not
# depend on the developer's PATH.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
