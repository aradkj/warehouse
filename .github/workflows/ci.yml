name: Warehouse CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warehouse-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify dependency consistency
        run: pip check

      - name: Ruff format check
        run: ruff format --check src/ tests/ migrations/ scripts/

      - name: Ruff lint
        run: ruff check src/ tests/ migrations/ scripts/

      - name: Mypy type checking
        run: mypy src/ scripts/

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Frontend TypeScript type check & build
        working-directory: frontend
        run: npm run build

      - name: Frontend unit & component tests
        working-directory: frontend
        run: npm test


      - name: Validate Production Docker Compose configuration
        env:
          ARAD_AUTH_JWT_SECRET: "ci-validation-secret-key-must-be-at-least-32-chars-long"
          POSTGRES_PASSWORD: "ci-postgres-validation-password"
          ARAD_APP_DB_PASSWORD: "ci-app-validation-password"
          RABBITMQ_PASSWORD: "ci-rabbitmq-validation-password"
          REDIS_PASSWORD: "ci-redis-validation-password"
          ELASTICSEARCH_PASSWORD: "ci-elasticsearch-validation-password"
          ARAD_DATABASE_URL: "postgresql+asyncpg://arad:arad@postgres:5432/arad"
          ARAD_RABBITMQ_URL: "amqp://arad:arad@rabbitmq:5672/"
          ARAD_REDIS_URL: "redis://:ci-redis-validation-password@redis:6379/0"
          ARAD_ELASTICSEARCH_URL: "http://elastic:ci-elasticsearch-validation-password@elasticsearch:9200"
        run: docker compose -f docker-compose.prod.yml config --quiet


  docker-tests:
    name: Integration, Concurrency, and Recovery Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify Test Docker Compose configuration
        run: docker compose --profile test config --quiet

      - name: Build test and migration images
        run: docker compose --profile test build test-migrate test

      - name: Run complete test suite (Unit, Concurrency, Failures, and Invariants)
        run: docker compose --profile test run --rm test

      - name: Verify Disaster Recovery Backup and Restoration
        run: docker compose --profile test run --rm test pytest tests/integration/test_backup_restore.py -v

      - name: Build runtime image
        if: success()
        run: docker build --target runtime --tag warehouse-api:ci .

      - name: Build test image
        if: success()
        run: docker build --target test --tag warehouse-test:ci .

      - name: Smoke test runtime image (API, Health, and SPA serving)
        if: success()
        run: |
          cleanup() {
            echo "Stopping and removing smoke-api container..."
            docker stop smoke-api 2>/dev/null || true
            docker rm smoke-api 2>/dev/null || true
          }
          trap cleanup EXIT

          docker run -d --name smoke-api \
            -p 8000:8000 \
            --read-only \
            --tmpfs /tmp \
            --cap-drop ALL \
            -e ARAD_ENVIRONMENT=production \
            -e ARAD_LOG_JSON=true \
            -e ARAD_AUTH_JWT_SECRET=smoke-test-secret-32-chars-long-minimum \
            -e ARAD_AUTH_REQUIRED=true \
            warehouse-api:ci

          echo "Waiting for container readiness probe on http://127.0.0.1:8000/healthz..."
          READY=0
          for i in $(seq 1 30); do
            if curl -s -f http://127.0.0.1:8000/healthz >/dev/null 2>&1; then
              echo "Health probe passed on attempt $i."
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "FAILED: Container failed to become healthy within 30 seconds."
            docker logs smoke-api --tail 50
            exit 1
          fi

          check_endpoint() {
            local url="$1"
            local expected_status="$2"
            local pattern="$3"
            local description="$4"

            echo "=== Smoke Test: $description ==="
            local resp_file
            resp_file=$(mktemp)
            local hdr_file
            hdr_file=$(mktemp)

            local status_code
            status_code=$(curl -s -S -w "%{http_code}" -D "$hdr_file" -o "$resp_file" "$url" || echo "000")
            local content_type
            content_type=$(grep -i '^content-type:' "$hdr_file" | tr -d '\r' | sed -e 's/^[cC]ontent-[tT]ype: *//')

            echo "  URL: $url"
            echo "  HTTP Status: $status_code (expected: $expected_status)"
            echo "  Content-Type: $content_type"

            if [ "$status_code" -ne "$expected_status" ]; then
              echo "  ERROR: HTTP status $status_code does not match expected $expected_status"
              echo "  Response excerpt:"
              head -n 20 "$resp_file" | sed 's/^/    /'
              rm -f "$resp_file" "$hdr_file"
              exit 1
            fi

            if [ -n "$pattern" ]; then
              if grep -q "$pattern" "$resp_file"; then
                echo "  Expected Content ('$pattern'): PRESENT"
              else
                echo "  ERROR: Expected pattern '$pattern' not found in response from $url"
                echo "  Response excerpt:"
                head -n 20 "$resp_file" | sed 's/^/    /'
                rm -f "$resp_file" "$hdr_file"
                exit 1
              fi
            fi

            rm -f "$resp_file" "$hdr_file"
            echo "  STATUS: PASSED"
          }

          check_endpoint "http://127.0.0.1:8000/healthz" 200 '"status"' "Health Probe Endpoint"
          check_endpoint "http://127.0.0.1:8000/" 200 "Arad Platform" "Root SPA Index Serving"
          check_endpoint "http://127.0.0.1:8000/orders/new" 200 "Arad Platform" "Client-Side SPA Routing Fallback"
          check_endpoint "http://127.0.0.1:8000/v1/nonexistent" 404 "API endpoint not found" "API Route 404 Isolation"

      - name: Stop containers and remove volumes
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans

  publish-image:
    name: Publish Runtime Image to GHCR
    runs-on: ubuntu-latest
    needs:
      - quality
      - docker-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short commit SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push runtime image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/aradkj/warehouse:latest
            ghcr.io/aradkj/warehouse:master
            ghcr.io/aradkj/warehouse:sha-${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
