name: Warehouse CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warehouse-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify dependency consistency
        run: pip check

      - name: Ruff format check
        run: ruff format --check src/ tests/ migrations/ scripts/

      - name: Ruff lint
        run: ruff check src/ tests/ migrations/ scripts/

      - name: Mypy type checking
        run: mypy src/ scripts/

      
      - name: Validate Production Docker Compose configuration
        env:
          ARAD_AUTH_JWT_SECRET: "ci-validation-secret-key-must-be-at-least-32-chars-long"
          POSTGRES_PASSWORD: "ci-postgres-validation-password"
          ARAD_APP_DB_PASSWORD: "ci-app-validation-password"
          RABBITMQ_PASSWORD: "ci-rabbitmq-validation-password"
          REDIS_PASSWORD: "ci-redis-validation-password"
          ELASTICSEARCH_PASSWORD: "ci-elasticsearch-validation-password"
          ARAD_DATABASE_URL: "postgresql+asyncpg://arad:arad@postgres:5432/arad"
          ARAD_RABBITMQ_URL: "amqp://arad:arad@rabbitmq:5672/"
          ARAD_REDIS_URL: "redis://:ci-redis-validation-password@redis:6379/0"
          ARAD_ELASTICSEARCH_URL: "http://elastic:ci-elasticsearch-validation-password@elasticsearch:9200"
        run: docker compose -f docker-compose.prod.yml config --quiet


  docker-tests:
    name: Integration, Concurrency, and Recovery Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify Test Docker Compose configuration
        run: docker compose --profile test config --quiet

      - name: Build test and migration images
        run: docker compose --profile test build test-migrate test

      - name: Run complete test suite (Unit, Concurrency, Failures, and Invariants)
        run: docker compose --profile test run --rm test

      - name: Verify Disaster Recovery Backup and Restoration
        run: docker compose --profile test run --rm test pytest tests/integration/test_backup_restore.py -v

      - name: Build runtime image
        if: success()
        run: docker build --target runtime --tag warehouse-api:ci .

      - name: Build test image
        if: success()
        run: docker build --target test --tag warehouse-test:ci .

      - name: Stop containers and remove volumes
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans