global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "arad-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
        labels:
          environment: "production"
          service: "arad-api"

  - job_name: "arad-workers"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["outbox-relay:8001"]
        labels:
          environment: "production"
          service: "outbox-relay"
