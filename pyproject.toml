[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arad-platform"
version = "0.1.0"
description = "Distributed Order and Inventory Orchestration Platform - Phase 1 (modular monolith, hexagonal architecture)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # Web / API
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.13.0",
    # Persistence
    "sqlalchemy[asyncio]==2.1.3",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    # Phase 2: Asynchronous processing & messaging
    "aio-pika>=9.4.0,<10.0.0",
    "celery>=5.4.0,<6.0.0",
    "kombu>=5.4.0,<6.0.0",
    # Phase 3: Redis caching & Elasticsearch search
    "redis>=5.0.0,<6.0.0",
    "elasticsearch>=8.12.0,<9.0.0",
    "aiohttp>=3.9.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "hypothesis==6.168.5",
    "ruff==0.16.10",
    "mypy==2.4.0",
]

[project.scripts]
arad-api = "bootstrap.cli:serve"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "bootstrap*",
    "shared*",
    "identity*",
    "catalog*",
    "inventory*",
    "ordering*",
    "fulfillment*",
    "search*",
    "audit*",
]

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole session: the async engine/connection pool and the
# migrated test database are session-scoped resources.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: pure domain tests (no infrastructure)",
    "application: use case tests running against in-memory fake ports",
    "contract: repository contract tests executed against every implementation",
    "repository: tests requiring a real PostgreSQL instance",
    "integration: end-to-end composition tests requiring PostgreSQL",
    "api: FastAPI endpoint tests",
    "concurrency: tests that exercise real parallel database transactions",
    "outbox: transactional outbox tests",
    "inbox: consumer inbox idempotency tests",
    "messaging: RabbitMQ & messaging integration tests",
    "celery: Celery worker and scheduler tests",
    "redis: Redis caching & infrastructure tests",
    "elasticsearch: Elasticsearch search infrastructure & indexer tests",
    "projection: Search projection and read-model tests",
]

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "migrations"]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "C4",       # comprehensions
    "SIM",      # simplify
    "TID",      # tidy imports
    "RUF",      # ruff-specific
    "ASYNC",    # flake8-async
    "S",        # flake8-bandit (security smells)
    "N",        # pep8-naming
]
ignore = [
    "S101",     # assert is fine in tests
    "B008",     # FastAPI Depends() in defaults is the documented pattern
    "N818",     # exception naming: domain errors are nouns, not *Error suffixed
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "SLF001"]
"migrations/**" = ["E501", "N999"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = [
    "bootstrap",
    "shared",
    "identity",
    "catalog",
    "inventory",
    "ordering",
    "fulfillment",
    "search",
    "audit",
]
exclude = "^(migrations|tests)/"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true
check_untyped_defs = true
extra_checks = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["bootstrap.workers"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["elasticsearch", "elasticsearch.*"]
ignore_missing_imports = true
